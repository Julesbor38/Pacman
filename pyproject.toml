[project]
name = "pacman"
version = "0.1.0"
description = "Pac-Man arcade game in Python (42 project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]


[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
