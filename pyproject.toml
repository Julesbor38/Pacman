[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mazegenerator",
]

[project.scripts]
pacman = "pacman:main"

[tool.uv.sources]
mazegenerator = { path = "vendor/mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
